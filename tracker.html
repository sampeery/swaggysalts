<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swaggy Salt — Tracker 🧂</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #b8e0f7;
    --sky-light: #d6eef9;
    --navy: #1a2f5e;
    --navy-light: #2a4080;
    --green: #4caf7d;
    --yellow: #f5a623;
    --red: #e53935;
    --card-bg: rgba(255,255,255,0.85);
    --shadow: 0 4px 20px rgba(26,47,94,0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--sky); color: var(--navy); }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  header {
    background: var(--navy);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 3px 15px rgba(26,47,94,0.3);
    z-index: 1000; position: relative;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 34px; height: 34px; }
  .brand h1 { font-family: 'Lilita One', cursive; color: #fff; font-size: 1.2rem; letter-spacing: 0.5px; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
  .brand h1 span { color: var(--sky); }
  .stats { display: flex; gap: 10px; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
  .stat .n { font-family: 'Lilita One', cursive; font-size: 1.1rem; color: #fff; line-height: 1; }
  .stat .l { color: var(--sky); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  #map { flex: 1; position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  .legend {
    position: absolute; bottom: 14px; left: 10px; z-index: 900;
    background: var(--card-bg); backdrop-filter: blur(6px);
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 12px; padding: 9px 11px; font-size: 0.7rem; font-weight: 700; color: var(--navy);
    display: flex; gap: 10px; box-shadow: var(--shadow); flex-wrap: wrap; max-width: 90%;
  }
  .legend div { display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }

  .hint {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 900; background: var(--navy); color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;
    pointer-events: none; transition: opacity 0.3s; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(20,32,73,0.25);
  }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(26,47,94,0.5); z-index: 2000;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--sky-light); border-radius: 24px 24px 0 0; padding: 20px 20px 30px;
    width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'Lilita One', cursive; font-size: 1.2rem; color: var(--navy); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--navy); line-height: 1; }
  .addr { font-size: 0.78rem; color: #5a7a9a; font-style: italic; margin-bottom: 14px; }

  .status-grid, .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .status-btn, .type-btn {
    border: 2px solid rgba(26,47,94,0.15); background: #fff; border-radius: 10px;
    padding: 10px 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem;
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--navy);
  }
  .status-btn.active { border-color: currentColor; background: var(--sky-light); }
  .status-btn[data-status="customer"].active { color: var(--green); }
  .status-btn[data-status="not_interested"].active { color: var(--red); }
  .status-btn[data-status="follow_up"].active { color: var(--yellow); }
  .status-btn[data-status="not_home"].active { color: #5a7a9a; }
  .type-btn.active { border-color: var(--navy); background: var(--navy); color: #fff; }

  .form-group { margin-bottom: 12px; }
  label { display: block; font-weight: 800; font-size: 0.78rem; color: var(--navy); margin-bottom: 5px; }
  input, textarea {
    width: 100%; border: 2px solid rgba(26,47,94,0.15); border-radius: 10px;
    padding: 10px 12px; font-family: 'Nunito', sans-serif; font-size: 0.88rem;
    background: #fff; color: var(--navy); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--navy); }
  textarea { resize: vertical; min-height: 56px; }

  .btn { border: none; border-radius: 10px; padding: 12px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem; cursor: pointer; }
  .btn-primary { background: var(--navy); color: #fff; flex: 1; }
  .btn-danger { background: #fdecea; color: var(--red); border: 2px solid var(--red); flex: 0 0 auto; padding: 12px 16px; }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="25" width="65" height="60" rx="14" fill="white" stroke="#1a2f5e" stroke-width="3"/>
        <path d="M35 65 Q50 78 65 65" stroke="#1a2f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="22" y="42" width="22" height="14" rx="5" fill="#1a2f5e"/>
        <rect x="56" y="42" width="22" height="14" rx="5" fill="#1a2f5e"/>
        <line x1="44" y1="49" x2="56" y2="49" stroke="#1a2f5e" stroke-width="2.5"/>
        <rect x="25" y="44" width="7" height="5" rx="2" fill="#4a7fcc" opacity="0.7"/>
        <rect x="59" y="44" width="7" height="5" rx="2" fill="#4a7fcc" opacity="0.7"/>
      </svg>
      <h1>SWAGGY <span>TRACKER</span></h1>
    </div>
    <div class="stats">
      <div class="stat"><span class="n" id="statCustomer">0</span><span class="l">Cust</span></div>
      <div class="stat"><span class="n" id="statFollow">0</span><span class="l">Follow</span></div>
      <div class="stat"><span class="n" id="statNot">0</span><span class="l">No</span></div>
      <div class="stat"><span class="n" id="statHome">0</span><span class="l">Away</span></div>
    </div>
  </header>
  <div id="map">
    <div class="hint" id="hint">📍 Press and hold anywhere to drop a pin</div>
    <div class="legend">
      <div><span class="dot" style="background:#4caf7d"></span>Customer</div>
      <div><span class="dot" style="background:#f5a623"></span>Follow-up</div>
      <div><span class="dot" style="background:#e53935"></span>Not interested</div>
      <div><span class="dot" style="background:#8a9bb5"></span>Not home</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="sheet-overlay">
  <div class="modal">
    <div class="modal-title">
      <span id="sheetTitle">New Stop</span>
      <button class="modal-close" onclick="closeSheet()">✕</button>
    </div>
    <div class="addr" id="sheetAddr">Loading address…</div>
    <div class="status-grid">
      <button type="button" class="status-btn" data-status="customer">🟢 Customer</button>
      <button type="button" class="status-btn" data-status="follow_up">🟡 Follow-up</button>
      <button type="button" class="status-btn" data-status="not_interested">🔴 Not interested</button>
      <button type="button" class="status-btn" data-status="not_home">⚪ Not home</button>
    </div>
    <div id="customerFields" style="display:none;">
      <div class="form-group"><label>Customer Name</label><input type="text" id="custName" placeholder="Jane Smith"></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" id="custPhone" placeholder="(555) 555-5555"></div>
      <div class="form-group"><label>Address</label><input type="text" id="custAddress" placeholder="Address"></div>
      <div class="type-grid">
        <button type="button" class="type-btn" data-type="one_time">One-time</button>
        <button type="button" class="type-btn" data-type="recurring">Recurring</button>
      </div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="notes" placeholder="Plan interest, best time to return, etc."></textarea></div>
    <div class="actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none">🗑️</button>
      <button class="btn btn-primary" id="saveBtn">Save Stop ✓</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'swaggy_tracker_pins'; // separate from the dashboard's storage — fully standalone
const COLORS = { customer: '#4caf7d', follow_up: '#f5a623', not_interested: '#e53935', not_home: '#8a9bb5' };

let pins = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let markers = {};
let map, geocoder;
let activeId = null, activeLatLng = null, activeStatus = 'customer', activeType = 'one_time';

function savePins() { localStorage.setItem(STORAGE_KEY, JSON.stringify(pins)); }

function initApp() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.5712, lng: -111.8018 },
    zoom: 13,
    disableDefaultUI: false,
    fullscreenControl: false,
    streetViewControl: false,
    mapTypeControl: false,
    clickableIcons: false
  });
  geocoder = new google.maps.Geocoder();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => map.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => {}
    );
  }

  setupLongPress();
  Object.entries(pins).forEach(([id, pin]) => addOrUpdateMarker(id, pin));
  renderStats();
}

function makeIconUrl(status) {
  const color = COLORS[status];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="36" viewBox="0 0 30 36"><path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 21 15 21s15-10.5 15-21C30 6.7 23.3 0 15 0z" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

function renderStats() {
  const counts = { customer: 0, follow_up: 0, not_interested: 0, not_home: 0 };
  Object.values(pins).forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
  document.getElementById('statCustomer').textContent = counts.customer;
  document.getElementById('statFollow').textContent = counts.follow_up;
  document.getElementById('statNot').textContent = counts.not_interested;
  document.getElementById('statHome').textContent = counts.not_home;
}

function addOrUpdateMarker(id, pin) {
  const icon = { url: makeIconUrl(pin.status), scaledSize: new google.maps.Size(30, 36), anchor: new google.maps.Point(15, 34) };
  if (markers[id]) {
    markers[id].setIcon(icon);
    markers[id].setPosition({ lat: pin.lat, lng: pin.lng });
  } else {
    const m = new google.maps.Marker({ position: { lat: pin.lat, lng: pin.lng }, map, icon });
    m.addListener('click', () => openSheet(id, pin.lat, pin.lng));
    markers[id] = m;
  }
}

function removeMarker(id) { if (markers[id]) { markers[id].setMap(null); delete markers[id]; } }

async function reverseGeocode(lat, lng) {
  return new Promise(resolve => {
    geocoder.geocode({ location: { lat, lng } }, (results, status) => {
      if (status === 'OK' && results && results[0]) {
        const comps = results[0].address_components;
        const get = t => { const c = comps.find(c => c.types.includes(t)); return c ? c.short_name : ''; };
        const streetPart = [get('street_number'), get('route')].filter(Boolean).join(' ');
        const cityPart = get('locality') || get('sublocality') || get('postal_town');
        const statePart = get('administrative_area_level_1');
        const line = [streetPart, cityPart, statePart].filter(Boolean).join(', ');
        resolve(line || results[0].formatted_address || null);
      } else resolve(null);
    });
  });
}

function updateStatusButtons() {
  document.querySelectorAll('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.status === activeStatus));
}
function updateTypeButtons() {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === activeType));
}
function toggleCustomerFields() {
  document.getElementById('customerFields').style.display = activeStatus === 'customer' ? 'block' : 'none';
}

function openSheet(id, lat, lng) {
  activeId = id;
  activeLatLng = [lat, lng];
  const existing = id ? pins[id] : null;
  activeStatus = existing ? existing.status : 'customer';
  activeType = existing && existing.customerType ? existing.customerType : 'one_time';

  document.getElementById('sheetTitle').textContent = existing ? 'Edit Stop' : 'New Stop';
  document.getElementById('notes').value = existing ? (existing.notes || '') : '';
  document.getElementById('custName').value = existing ? (existing.name || '') : '';
  document.getElementById('custPhone').value = existing ? (existing.phone || '') : '';
  document.getElementById('custAddress').value = existing ? (existing.address || '') : '';
  document.getElementById('custAddress').placeholder = 'Address';
  document.getElementById('deleteBtn').style.display = existing ? 'inline-flex' : 'none';
  document.getElementById('sheetAddr').textContent = 'Loading address…';

  updateStatusButtons();
  updateTypeButtons();
  toggleCustomerFields();
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('hint').style.opacity = '0';

  reverseGeocode(lat, lng).then(addr => {
    document.getElementById('sheetAddr').textContent = addr || 'Address not found';
    if (!existing || !existing.address) {
      document.getElementById('custAddress').value = addr || '';
      document.getElementById('custAddress').placeholder = addr ? 'Address' : 'Address not found — type it here';
    }
  });
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  activeId = null; activeLatLng = null;
}

document.getElementById('sheet-overlay').addEventListener('click', e => {
  if (e.target.id === 'sheet-overlay') closeSheet();
});

document.querySelectorAll('.status-btn').forEach(btn => {
  btn.addEventListener('click', () => { activeStatus = btn.dataset.status; updateStatusButtons(); toggleCustomerFields(); });
});
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => { activeType = btn.dataset.type; updateTypeButtons(); });
});

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!activeLatLng) return;
  const id = activeId && pins[activeId] ? activeId : 'pin_' + Date.now();
  const pin = {
    lat: activeLatLng[0],
    lng: activeLatLng[1],
    status: activeStatus,
    notes: document.getElementById('notes').value,
    updated: new Date().toISOString()
  };
  if (activeStatus === 'customer') {
    pin.name = document.getElementById('custName').value.trim();
    pin.phone = document.getElementById('custPhone').value.trim();
    pin.address = document.getElementById('custAddress').value.trim();
    pin.customerType = activeType;
  }
  pins[id] = pin;
  addOrUpdateMarker(id, pin);
  renderStats();
  savePins();
  closeSheet();
});

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (!activeId) return;
  delete pins[activeId];
  removeMarker(activeId);
  renderStats();
  savePins();
  closeSheet();
});

function setupLongPress() {
  let pressTimer = null;
  map.addListener('mousedown', e => {
    pressTimer = setTimeout(() => { openSheet(null, e.latLng.lat(), e.latLng.lng()); pressTimer = null; }, 500);
  });
  map.addListener('mouseup', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
  map.addListener('drag', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAsmuxH0mDBA6kVli3yiSaEfHvD53NATT8&callback=initApp&loading=async" async defer></script>
</body>
</html>
